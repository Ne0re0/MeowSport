name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'ci/**'
  pull_request:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MeowSport.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeowSport-apk
          path: MeowSport.apk

      # On main, publish the APK as a GitHub release so it can be downloaded from the phone.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MeowSport 1.0.${{ github.run_number }}
          files: MeowSport.apk
          make_latest: true
